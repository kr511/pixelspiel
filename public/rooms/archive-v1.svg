<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240" shape-rendering="crispEdges">
  <!-- Felice × Elias – Das Erinnerungsarchiv (Finale des Abenteuers). Pixelgrafik, 320 × 240. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1430"/><stop offset="1" stop-color="#2d2150"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2c5c"/><stop offset="1" stop-color="#241a3b"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffe9b8" stop-opacity=".55"/><stop offset="1" stop-color="#ffe9b8" stop-opacity="0"/></radialGradient>
    <pattern id="tiles" width="16" height="12" patternUnits="userSpaceOnUse"><rect width="16" height="12" fill="#33284f"/><rect width="15" height="11" fill="#3b2f5c"/><rect x="1" y="1" width="6" height="1" fill="#4a3d70"/></pattern>
  </defs>
  <rect width="320" height="240" fill="url(#sky)"/>
  <!-- back wall with a starry window -->
  <rect x="40" y="0" width="240" height="96" fill="#251c40"/>
  <path d="M112 10H208V22H220V82H100V22H112Z" fill="#120d22"/>
  <g fill="#f6e7b6">
    <rect x="118" y="26" width="2" height="2"/><rect x="146" y="18" width="1" height="1"/><rect x="171" y="30" width="2" height="2"/><rect x="196" y="22" width="1" height="1"/>
    <rect x="132" y="46" width="1" height="1"/><rect x="186" y="52" width="2" height="2"/><rect x="206" y="40" width="1" height="1"/><rect x="110" y="60" width="1" height="1"/><rect x="158" y="62" width="1" height="1"/>
  </g>
  <path d="M100 22H112V10H208V22H220" fill="none" stroke="#5a4a8a" stroke-width="3"/>
  <rect x="98" y="80" width="124" height="5" fill="#5a4a8a"/>
  <!-- dais where Elias waits -->
  <ellipse cx="160" cy="98" rx="62" ry="12" fill="url(#glow)"/>
  <rect x="104" y="92" width="112" height="14" fill="#4b3c74"/><rect x="104" y="92" width="112" height="3" fill="#6d5aa3"/><rect x="96" y="104" width="128" height="6" fill="#3a2d5f"/>
  <!-- floor -->
  <rect x="40" y="106" width="240" height="134" fill="url(#tiles)"/>
  <rect x="40" y="106" width="240" height="134" fill="url(#floor)" opacity=".55"/>
  <!-- central carpet of light -->
  <rect x="146" y="110" width="28" height="130" fill="#4f3f7c"/><rect x="150" y="110" width="20" height="130" fill="#5d4b8e"/>
  <g fill="#e3c97f" opacity=".7"><rect x="159" y="124" width="2" height="2"/><rect x="159" y="150" width="2" height="2"/><rect x="159" y="176" width="2" height="2"/><rect x="159" y="202" width="2" height="2"/></g>
  <!-- left and right shelves full of memories -->
  <g id="shelf">
    <rect x="0" y="0" width="42" height="240" fill="#1e1633"/>
    <rect x="4" y="8" width="34" height="226" fill="#3b2a24"/>
    <g fill="#24180f"><rect x="6" y="12" width="30" height="34"/><rect x="6" y="52" width="30" height="34"/><rect x="6" y="92" width="30" height="34"/><rect x="6" y="132" width="30" height="34"/><rect x="6" y="172" width="30" height="34"/></g>
    <g fill="#c58f5d"><rect x="8" y="26" width="4" height="20"/><rect x="13" y="22" width="3" height="24"/><rect x="24" y="30" width="5" height="16"/><rect x="9" y="66" width="3" height="20"/><rect x="20" y="62" width="4" height="24"/><rect x="28" y="70" width="5" height="16"/><rect x="8" y="104" width="5" height="22"/><rect x="26" y="108" width="3" height="18"/><rect x="12" y="148" width="4" height="18"/><rect x="22" y="142" width="3" height="24"/><rect x="9" y="186" width="5" height="20"/><rect x="27" y="190" width="4" height="16"/></g>
    <g fill="#8fa7d8"><rect x="17" y="30" width="5" height="16"/><rect x="13" y="70" width="5" height="16"/><rect x="15" y="110" width="8" height="16"/><rect x="28" y="150" width="5" height="16"/><rect x="17" y="190" width="6" height="16"/></g>
    <g fill="#ffe2a0"><rect x="30" y="36" width="4" height="4"/><rect x="30" y="76" width="3" height="3"/><rect x="30" y="114" width="4" height="4"/><rect x="8" y="156" width="3" height="3"/><rect x="32" y="196" width="3" height="3"/></g>
  </g>
  <use href="#shelf" transform="translate(320 0) scale(-1 1)"/>
  <!-- floating memory lights -->
  <g fill="#ffe2a0" opacity=".85"><rect x="62" y="40" width="3" height="3"/><rect x="84" y="70" width="2" height="2"/><rect x="250" y="48" width="3" height="3"/><rect x="236" y="76" width="2" height="2"/><rect x="70" y="128" width="2" height="2"/><rect x="252" y="134" width="2" height="2"/></g>
  <g fill="#b9a6ff" opacity=".8"><rect x="74" y="20" width="2" height="2"/><rect x="262" y="24" width="2" height="2"/><rect x="58" y="100" width="2" height="2"/><rect x="266" y="104" width="2" height="2"/></g>
  <!-- four pedestals -->
  <g id="pedestal"><rect x="-8" y="0" width="16" height="4" fill="#8070b0"/><rect x="-6" y="4" width="12" height="12" fill="#5a4b88"/><rect x="-6" y="4" width="3" height="12" fill="#6f5fa0"/><rect x="-9" y="16" width="18" height="4" fill="#3d3066"/></g>
  <use href="#pedestal" x="102" y="138"/><use href="#pedestal" x="141" y="140"/><use href="#pedestal" x="179" y="140"/><use href="#pedestal" x="218" y="138"/>
  <!-- the way back: a soft door of light -->
  <path d="M146 240V222H150V216H170V222H174V240Z" fill="#6a58a0"/><path d="M151 240V224H155V219H165V224H169V240Z" fill="#f2deb0" opacity=".55"/>
  <ellipse cx="160" cy="236" rx="32" ry="6" fill="url(#glow)"/>
</svg>
