name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Read Pages configuration
        id: pages
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const fallback = repo.toLowerCase() === `${owner}.github.io`.toLowerCase() ? '/' : `/${repo}/`;
            try {
              const { data } = await github.rest.repos.getPages({ owner, repo });
              core.setOutput('enabled', data.build_type === 'workflow' ? 'true' : 'false');
              core.setOutput('base_path', new URL(data.html_url).pathname.replace(/\/?$/, '/'));
              if (data.build_type !== 'workflow') {
                await core.summary.addHeading('GitHub Pages einrichten').addRaw('Bitte unter Settings → Pages als Source „GitHub Actions“ wählen und diesen Workflow erneut starten.').write();
              }
            } catch (error) {
              if (![403, 404].includes(error.status)) throw error;
              core.setOutput('enabled', 'false');
              core.setOutput('base_path', fallback);
              await core.summary.addHeading('Statischer Build bereit').addRaw('GitHub Pages ist noch nicht eingerichtet oder für dieses Repository nicht verfügbar. Unter Settings → Pages als Source „GitHub Actions“ wählen und danach diesen Workflow erneut starten. Private Repositories benötigen einen GitHub-Tarif, der Pages unterstützt.').write();
            }
      - name: Install dependencies
        run: npm ci
      - name: Verify game
        run: |
          npm test
          npm run typecheck
          npm run lint
      - name: Check offline copy in spiel/
        run: |
          npm run build:spiel
          if [ -n "$(git status --porcelain -- spiel)" ]; then
            git status --short -- spiel
            echo "::error::spiel/ passt nicht zum Quellcode. Lokal 'npm run build:spiel' ausführen und spiel/ mit committen."
            exit 1
          fi
      - name: Browser check (spiel/ in Chromium)
        run: |
          python3 -m venv /tmp/qa-venv
          /tmp/qa-venv/bin/pip install --quiet playwright
          /tmp/qa-venv/bin/python -m playwright install --with-deps chromium
          node scripts/serve-local.mjs &
          sleep 2
          /tmp/qa-venv/bin/python scripts/check-game-browser.py --base-url http://127.0.0.1:8765/ --output /tmp/browser-qa
      - name: Build static game
        run: npm run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
